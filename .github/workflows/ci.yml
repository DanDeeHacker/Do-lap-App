# Every pull request and every push to main: the same checks a session runs before shipping
# (CLAUDE.md → Commands). Make "backend", "frontend" and "i18n" required in branch protection.
name: CI
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt pytest
      - name: pytest
        working-directory: backend
        run: python -m pytest -q
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: type check
        working-directory: frontend
        run: npx tsc --noEmit -p .
      - name: build
        working-directory: frontend
        run: npm run build
  i18n:
    # the English dictionary must be rebuilt and committed with the strings it translates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
        working-directory: frontend
      - run: node scripts/i18n/extract_frontend.cjs && python scripts/i18n/extract_backend.py && python scripts/i18n/merge.py
      - name: dictionary is up to date
        run: git diff --exit-code -- frontend/src/i18n/en.json scripts/i18n/src_frontend.json scripts/i18n/src_backend.json
